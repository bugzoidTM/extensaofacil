server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Atrás do Traefik o nginx enxerga só a porta 8080; sem isso o 301 de barra final
    # apontava para http://extensaofacil.com.br:8080/. Relativo, o navegador resolve
    # contra a URL atual e mantém https e a porta 443.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # assets com hash no nome: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Cada rota tem seu próprio index.html pré-renderizado (scripts/prerender.ts).
    # $uri/ deixa o nginx servir o index.html do diretório e redirecionar 301 para a
    # versão com barra final. Rota sem arquivo é 404 de verdade — não existe mais o
    # fallback para o index.html da home, que devolvia 200 em qualquer URL inventada.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
