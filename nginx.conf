# Atrás da Cloudflare, o IP que chega aqui é o da borda dela — o visitante real
# some do log e não dá para conferir se um rastreador é legítimo. O CF-Connecting-IP
# carrega o IP verdadeiro; a Cloudflare sobrescreve esse cabeçalho, então ele é
# confiável enquanto todo o tráfego passar por ela.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# Formato com o IP real, o país que a Cloudflare informa e o identificador da
# requisição na borda, para cruzar com o painel dela quando necessário.
log_format cloudflare '$remote_addr $http_cf_ipcountry - [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" cf=$http_cf_ray';

server {
    listen 8080;
    access_log /var/log/nginx/access.log cloudflare;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Atrás do Traefik o nginx enxerga só a porta 8080; sem isso o 301 de barra final
    # apontava para http://extensaofacil.com.br:8080/. Relativo, o navegador resolve
    # contra a URL atual e mantém https e a porta 443.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # assets com hash no nome: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Cada rota tem seu próprio index.html pré-renderizado (scripts/prerender.ts).
    # $uri/ deixa o nginx servir o index.html do diretório e redirecionar 301 para a
    # versão com barra final. Rota sem arquivo é 404 de verdade — não existe mais o
    # fallback para o index.html da home, que devolvia 200 em qualquer URL inventada.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
